<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE FILE — the one place the architecture diagram is edited.

  `npm run assets` turns this into four rendered copies, which are the files that
  actually get shown:

    docs/public/architecture-light.svg   GitHub in its light theme
    docs/public/architecture-dark.svg    GitHub in its dark theme
    docs/public/architecture.svg         npm, and anything that strips <picture>
    docs/index.md                        inline, follows the VitePress theme toggle

  Geometry and labels only: no colours, no <style>. Everything is expressed through
  the class contract that docs/.vitepress/theme/custom.css defines — .node,
  .node-accent, .edge, .edge-accent, .edge-dashed, .label-title, .label-mono,
  .label-muted — and the generator supplies a matching palette per output.

  The three boxes on the right are the point of this particular diagram. Search
  Console alone cannot create a working property: ownership lives in a separate
  service, on a separate host, behind a separate scope, and it names the same site
  a different way. A diagram showing one API would be describing a different
  server. Do not write a raw "&" in a label — the SVG is inlined into a VitePress
  page, which compiles it as a Vue template.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How google-search-console-mcp connects an MCP client to three Google APIs</title>
  <desc id="arch-desc">An MCP client talks to google-search-console-mcp over stdio. The server calls three separate Google services over HTTPS: the Search Console API for properties, sitemaps and analytics; the Site Verification API for proving ownership; and the Indexing API for change notifications. Each is requested with its own OAuth scope, and only when a registered tool needs it.</desc>

  <defs>
    <marker id="arch-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
    <marker id="arch-arrow-accent" class="accent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
  </defs>

  <rect class="node" x="16" y="110" width="150" height="80" rx="10" />
  <text class="label-title" x="91" y="143" text-anchor="middle">MCP client</text>
  <text class="label-muted" x="91" y="163" text-anchor="middle">Claude, Codex, …</text>

  <rect class="node-accent" x="248" y="100" width="196" height="100" rx="10" />
  <text class="label-title" x="346" y="133" text-anchor="middle">Search Console MCP</text>
  <text class="label-muted" x="346" y="153" text-anchor="middle">21 tools, 5 essential</text>
  <text class="label-muted" x="346" y="173" text-anchor="middle">confirm tokens</text>

  <path class="edge-accent" d="M166,150 L240,150" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="203" y="138" text-anchor="middle">stdio</text>

  <rect class="node" x="530" y="26" width="176" height="66" rx="10" />
  <text class="label-title" x="618" y="53" text-anchor="middle">Search Console</text>
  <text class="label-muted" x="618" y="72" text-anchor="middle">sitemaps, analytics</text>

  <rect class="node" x="530" y="117" width="176" height="66" rx="10" />
  <text class="label-title" x="618" y="144" text-anchor="middle">Site Verification</text>
  <text class="label-muted" x="618" y="163" text-anchor="middle">proves ownership</text>

  <rect class="node" x="530" y="208" width="176" height="66" rx="10" />
  <text class="label-title" x="618" y="235" text-anchor="middle">Indexing</text>
  <text class="label-muted" x="618" y="254" text-anchor="middle">change notices</text>

  <path class="edge-accent" d="M444,138 L522,66" marker-end="url(#arch-arrow-accent)" />
  <path class="edge-accent" d="M444,150 L522,150" marker-end="url(#arch-arrow-accent)" />
  <path class="edge-accent" d="M444,162 L522,234" marker-end="url(#arch-arrow-accent)" />

  <text class="label-mono" x="487" y="108" text-anchor="middle">HTTPS</text>
  <text class="label-muted" x="487" y="196" text-anchor="middle">one scope each</text>
</svg>
