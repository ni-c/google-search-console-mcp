  <title id="arch-title">How google-search-console-mcp connects an MCP client to three Google APIs</title>
  <desc id="arch-desc">An MCP client talks to google-search-console-mcp over stdio. The server calls three separate Google services over HTTPS: the Search Console API for properties, sitemaps and analytics; the Site Verification API for proving ownership; and the Indexing API for change notifications. Each is requested with its own OAuth scope, and only when a registered tool needs it.</desc>

